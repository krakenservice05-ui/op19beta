<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 44 600 112" fill="none">
  <!-- Nintendo horizontal wordmark — pill border with Nintendo text inside -->
  <!-- Outer pill -->
  <rect x="22" y="44" width="556" height="112" rx="56" fill="none" stroke="white" stroke-width="12"/>
  <!-- Inner pill cutout -->
  <rect x="38" y="60" width="524" height="80" rx="40" fill="none" stroke="white" stroke-width="0"/>
  <!-- Nintendo wordmark text -->
  <text
    x="300"
    y="122"
    text-anchor="middle"
    font-family="'Arial', 'Helvetica Neue', Helvetica, sans-serif"
    font-weight="700"
    font-size="58"
    fill="white"
    letter-spacing="2"
  >Nintendo</text>
  <!-- Registered trademark -->
  <text
    x="556"
    y="76"
    font-family="Arial, sans-serif"
    font-size="28"
    fill="white"
    opacity="0.9"
  >®</text>
</svg>
